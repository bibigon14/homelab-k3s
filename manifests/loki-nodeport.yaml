---
# NodePort exposure of the in-cluster Loki Service so the host-level
# Grafana (grafana.homelab.local, systemd) can reach it over
# localhost:30310. Mirrors tempo-nodeport.yaml, same pattern.
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30310
